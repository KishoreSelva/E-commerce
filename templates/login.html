<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="content=device-width initial-scale=1.0">
      <link href="../static/styles.css" rel="stylesheet">
      <title>login</title> 
  </head> 
  <body>
    <div class="container">
      <header class="section-head">
        <h1 class="header1" id="title">Login here</h1>
        <p class="para1" id="description">Please enter the email and password to enter your account</p>
      </header>
      <form id="survey-form" action="/login" method="post">

        <div class="form-entry">
          <label id="email-label" for="email">Email </label>
          <input id="email" class="name-text" type="email" name="email" placeholder="Enter your email" required/>
        </div>

        <div class="form-entry">
          <label id="number-label" for="number">Password</label>
          <input id="number" class="name-text" type="password" name="password" placeholder="Enter your password" min="1" max="99" required/>
        </div>

        <div class="form-entry">
          <button id="submit" class="button-submit" type="submit">Sign in</button>
        </div>        
        
      </form>
    </div>
    
    <script>
      document.addEventListener("DOMContentLoaded" , () => {
      document.getElementById('survey-form').addEventListener('submit', async function(event) {
          event.preventDefault();
          const formData = new FormData(event.target);
          const response = await fetch('/login', {
              method: 'POST',
              body: formData
          });
          if (response.ok) {
              localStorage.clear();
              const user = await response.json();
              localStorage.setItem('user_info', JSON.stringify(user));
              localStorage.setItem('auth_token', JSON.stringify(user.token));
              window.location.href = '/get_categories';
          } else {
              alert('Login failed. Please check your credentials.');
          }
      });
  });
  </script>

  </body>
</html>
